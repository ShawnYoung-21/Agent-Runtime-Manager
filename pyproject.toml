[project]
name = "agent-runtime-manager"
version = "1.0.0"
description = "面向本地 AI Agent 的 CLI First 运行管理层：根据 Agent 生命周期智能管理运行环境"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "psutil>=6.0",
    "pywin32>=306; sys_platform == 'win32'",
    "tomli-w>=1.0",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
    "pywebview>=6.2.1",
    "pywinauto>=0.6.9",
]

[project.scripts]
arm = "arm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm"]


[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# 本机 %TEMP%\pytest-of-<user> 权限异常，固定到项目内
addopts = "-p no:cacheprovider --basetemp=.pytest_tmp_auto"
